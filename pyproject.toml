[project]
name = "cjk-data-profiling"
version = "0.1.0"
description = "CJK font compatibility patch for `ydata-profiling`/`fg-data-profiling` using Matplotlib and WordCloud."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "cjk",
    "data-profiling",
    "matplotlib",
    "wordcloud",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "matplotlib",
    "wordcloud",
]

[[project.authors]]
name = "t-onoz"
email = "18749921+t-onoz@users.noreply.github.com"

[project.optional-dependencies]
profiling = ["fg-data-profiling"]
dev = [
    "mypy",
    "pyright",
    "pytest",
    "ruff",
    "tox>=4",
    "tox-uv",
]
[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["pyproject.toml.orig"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = [
    "src",
    "tests",
]

[[tool.mypy.overrides]]
module = [
    "wordcloud",
    "wordcloud.*",
]
ignore_missing_imports = true

[tool.pyright]
include = [
    "src",
    "tests",
]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs against an installed profiling library"]

[tool.tox]
env_list = ["py311", "py312", "py313", "py314"]
skip_missing_interpreters = false

[tool.tox.env_run_base]
description = "run unit and Matplotlib rendering tests with {base_python}"
runner = "uv-venv-lock-runner"
package = "wheel"
extras = ["dev"]
uv_python_preference = "managed"
commands = [["pytest", "-m", "not integration"]]
